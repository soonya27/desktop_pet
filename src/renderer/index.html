<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:"
    />
    <title>withChii</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/character.css" />
    <link rel="stylesheet" href="./styles/bubble.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bubble" id="bubble" hidden>
        <p class="bubble-text" id="bubbleText"></p>
        <div class="bubble-actions" id="bubbleActions">
          <button type="button" class="bubble-btn" id="bubbleSnooze">5분 뒤</button>
          <button type="button" class="bubble-btn is-primary" id="bubbleOk">확인</button>
        </div>
      </div>
      <div class="bowl" id="bowl" hidden>
        <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg">
          <ellipse class="bowl-food" cx="20" cy="10" rx="13" ry="6" fill="#c97b3a" />
          <path d="M3 10 Q20 34 37 10 Z" fill="#7fb3e6" stroke="#4e86bd" stroke-width="1.5" />
          <ellipse cx="20" cy="10" rx="17" ry="4" fill="none" stroke="#4e86bd" stroke-width="1.5" />
        </svg>
      </div>
      <div class="character" id="character" data-anim="idle" data-mood="normal"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
